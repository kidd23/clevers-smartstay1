<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clevers SmartStay</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0c2340;
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: 800px;
    padding: 40px;
    border-radius: 20px;
    background: rgba(255,255,255,0.1);
    text-align: center;
}

h1 {
    font-size: 50px;
}

p {
    font-size: 30px;
}

</style>

</head>

<body>

<div class="card">

<h1>Clevers Lakeview Resort</h1>

<h1>
Welcome <span id="guestName">Loading...</span>
</h1>

<p>
Room: <span id="roomNumber">---</span>
</p>

<p>
Check Out: <span id="checkout">---</span>
</p>

<p>
WiFi: <span id="wifi">---</span>
</p>

</div>


<script>

const API_URL = "https://script.google.com/macros/s/AKfycbx6TJEqFg6d75MyxVtMTypJupYlXd8PdEw9Qlt1-0KV0eHyoS0MF8nRfIUoyt26fADb8A/exec";


// Get room number from the TV link
const urlParams = new URLSearchParams(window.location.search);

const room = urlParams.get("room");


if (!room) {

    document.getElementById("guestName").innerHTML =
    "Room number missing";

}

else {


fetch(API_URL + "?room=" + room)

.then(response => response.json())

.then(data => {


console.log("Received data:", data);


if(data.error){

document.getElementById("guestName").innerHTML =
data.error;

return;

}


// Display information

document.getElementById("guestName").innerHTML =
data.guest || "Guest";


document.getElementById("roomNumber").innerHTML =
data.room || room;


document.getElementById("checkout").innerHTML =
data.checkOut || "-";


document.getElementById("wifi").innerHTML =
data.wifi || "-";


})


.catch(error => {

console.log(error);

document.getElementById("guestName").innerHTML =
"Unable to connect";

});


}


</script>


</body>
</html>
