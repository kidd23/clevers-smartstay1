<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clevers SmartStay</title>

<style>

body {
    margin:0;
    font-family:Arial, sans-serif;
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background-image:
    linear-gradient(
    rgba(0,0,0,0.55),
    rgba(0,0,0,0.55)
    ),
    url("lakeview.jpeg");

    background-size:cover;
    background-position:center;
}


.card {

    width:850px;
    padding:50px;
    border-radius:25px;

    background:rgba(255,255,255,0.12);

    backdrop-filter:blur(8px);

    text-align:center;

}
h1 {
    font-size: 50px;
}

p {
    font-size: 30px;
}

</style>

</head>

<body>

<div class="card">
    <img src="logo.png" 
style="
width:220px;
margin-bottom:20px;
">


<h1>
Welcome to Clevers Lakeview Resort
</h1>

<h2>
<span id="guestName">Loading...</span>
</h2>
<p>
Room: <span id="roomNumber">---</span>
</p>

<p>
Check Out: <span id="checkout">---</span>
</p>
    <p>
We hope you enjoy your stay with us 🌅
</p>

<p>
WiFi: <span id="wifi">---</span>
</p>

</div>


<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzy_WiScqDNsekKqMngSHl-xb2H57-_Pf1nFt8Dw_vIe0rFs0-9oWzrUyx5vEJzAWKWcg/exec";


// Get room number from the TV link
let room = localStorage.getItem("room");

if (!room) {
    room = prompt("Enter room number");
    localStorage.setItem("room", room);
}


if (!room) {

    document.getElementById("guestName").innerHTML =
    "Room number missing";

}

else {


fetch(API_URL + "?room=" + room)

.then(response => response.json())

.then(data => {


console.log("Received data:", data);


if(data.error){

document.getElementById("guestName").innerHTML =
data.error;

return;

}


// Display information

document.getElementById("guestName").innerHTML =
data.guest || "Guest";


document.getElementById("roomNumber").innerHTML =
data.room || room;


document.getElementById("checkout").innerHTML =
data.checkOut || "-";


document.getElementById("wifi").innerHTML =
data.wifi || "-";


})


.catch(error => {

console.log(error);

document.getElementById("guestName").innerHTML =
"Unable to connect";

});


}


</script>


</body>
</html>
