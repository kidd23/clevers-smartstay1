<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clevers SmartStay</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#0c2340;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{

width:800px;
padding:40px;
border-radius:20px;
background:rgba(255,255,255,.1);

}

h1{

font-size:50px;

}

h2{

font-size:35px;

}

</style>

</head>

<body>

<div class="card">

<h1>Clevers Lakeview Resort</h1>

<h1>Welcome <span id="guestName">Guest</span></h1>

<p>Room: <span id="roomNumber"></span></p>

<p>Check Out: <span id="checkout"></span></p>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbx6TJEqFg6d75MyxVtMTypJupYlXd8PdEw9Qlt1-0KV0eHyoS0MF8nRfIUoyt26fADb8A/exec";

const params = new URLSearchParams(window.location.search);
const roomNumber = params.get("room");

if (!roomNumber) {
    document.getElementById("guestName").innerHTML = "Room number missing";
} else {

    fetch(API_URL + "?room=" + roomNumber)
    .then(response => response.json())
    .then(data => {

        if (data.error) {
            document.getElementById("guestName").innerHTML = data.error;
            return;
        }

        document.getElementById("guestName").innerHTML = data.guest;
        document.getElementById("roomNumber").innerHTML = roomNumber;
        document.getElementById("checkout").innerHTML = data.checkOut;

    })
    .catch(error => {
        document.getElementById("guestName").innerHTML = "Connection error";
        console.log(error);
    });

}

</script>
  
</body>
</html>
